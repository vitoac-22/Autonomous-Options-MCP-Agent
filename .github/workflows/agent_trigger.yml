name: Institutional Options Alpha Agent EOD

on:
  schedule:
    - cron: '30 19 * * 1-5'
  workflow_dispatch: 

jobs:
  run-alpha-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Alpaca CLI on Runner
        run: curl -sL https://alpaca.markets/cli/install.sh | bash

      - name: Execute Autonomous Trading Pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: python main_pipeline.py