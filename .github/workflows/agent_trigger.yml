name: Institutional Options Alpha Agent EOD

on:
  schedule:
    # Three attempts, not one.
    #
    # The previous schedule was a single 19:45 UTC (15:45 ET) run, fifteen
    # minutes before the close. It never fired — not once in the repo's
    # history, across every weekday the workflow has been on main. GitHub
    # queues scheduled workflows rather than guaranteeing them: delays of
    # 10-60 minutes are routine and runs are dropped outright under load, so
    # fifteen minutes of slack meant the run had to be perfectly punctual to
    # be worth anything at all.
    #
    # These land mid-session with hours of slack, on odd minutes to avoid the
    # congested top of the hour. Running three times a day does not trade
    # three times: the pipeline reconciles open positions first and takes the
    # monitoring path when anything is live, so later runs manage the position
    # the first one opened rather than opening another.
    - cron: '7 15 * * 1-5'    # 11:07 ET — mid-morning, tight spreads
    - cron: '13 17 * * 1-5'   # 13:13 ET — midday backup
    - cron: '19 19 * * 1-5'   # 15:19 ET — last chance, 41 min before the close
  workflow_dispatch: 

permissions:
  contents: write        # required to commit the decision journal back

jobs:
  run-alpha-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # uvx runs Alpaca's official MCP server in its own isolated environment.
      # It has to stay isolated: alpaca-mcp-server needs mcp 1.29.x while our
      # own server needs mcp 2.1.1, and installing them together breaks one.
      - name: Install uv (for uvx)
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Warm the Alpaca MCP server cache
        run: uvx --from alpaca-mcp-server python -c "print('alpaca-mcp-server ready')" || true

      - name: Execute Autonomous Trading Pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: python main_pipeline.py

      # The runner is destroyed when the job ends, so the decision journal has
      # to be committed back or the dashboard can never see it. This is what
      # makes the telemetry panel work in production.
      - name: Persist decision journal
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: record agent decisions [skip ci]"
            git push
          else
            echo "No new decisions to record."
          fi